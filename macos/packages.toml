# Package manifest for Homebrew setup.
# Source of truth for `dotfiles brew install` and `dotfiles brew stale`.
#
# Skip flagged groups per run: dotfiles brew install --no-ai --no-productivity --no-social

[taps]
list = ["axiomhq/tap", "jundot/omlx"]
trusted_formulae = ["jundot/omlx/omlx"]
trusted_casks = ["axiomhq/tap/axiom"]

# =============================================================================
# CLI Tools (formulae)
# =============================================================================

[[section]]
name = "Core CLI"
kind = "formula"
packages = [
  { name = "git",                  note = "Version control" },
  { name = "git-lfs",              note = "Git Large File Storage" },
  { name = "git-delta",            note = "Beautiful git diffs (used by .gitconfig)" },
  { name = "gh",                   note = "GitHub CLI (PRs, issues, actions)" },
  { name = "jq",                   note = "JSON processor" },
  { name = "yq",                   note = "YAML processor (like jq for YAML)" },
  { name = "wget",                 note = "Web downloader" },
  { name = "openssl",              note = "TLS/crypto toolkit" },
  { name = "bash-completion@2",    note = "Bash completion" },
  { name = "helix",                note = "Postmodern modal terminal editor (Rust, batteries-included LSP/Treesitter — binary is `hx`)" },
  { name = "bat",                  note = "Syntax-highlighting `cat` replacement and pager" },
  { name = "fd",                   note = "Fast file finder (yazi: find-by-name / `f`)" },
  { name = "ripgrep",              note = "Fast content search (yazi: find-in-files / `F`)" },
  { name = "fzf",                  note = "Fuzzy finder (yazi: interactive fuzzy jump)" },
  { name = "zoxide",               note = "Smart `cd` with frecency (yazi: `z` jump)" },
  { name = "yazi",                 note = "Blazing-fast terminal file manager (Rust)" },
  { name = "poppler",              note = "PDF preview (pdftoppm)" },
  { name = "resvg",                note = "SVG-to-PNG rasterizer" },
  { name = "imagemagick",          note = "Image conversion for long-tail formats (.heic, .psd, .tiff)" },
  { name = "chafa",                note = "Terminal image renderer (yazi inline image previews)" },
  { name = "sevenzip",             note = "Peek inside archives (.zip, .7z, .rar)" },
  { name = "ffmpeg",               note = "Video/audio thumbnails", disabled = true, reason = "Disabled 2026-08-25 (dated retroactively): ~300MB+ with deps, rarely needed" },
  { name = "tmux",                 note = "Terminal multiplexer", disabled = true, reason = "Retired 2026-08-26: no local or phone terminal-continuity workflow; Paseo owns agent continuity" },
  { name = "mosh",                 note = "Roaming SSH shell", disabled = true, reason = "Retired 2026-08-26: phone access is Paseo over Tailscale; no phone shell is required" },
  { name = "zellij",               note = "Former terminal workspace, session manager, and browser shell", disabled = true, reason = "Retired 2026-08-26: web, layouts, and resurrection were unused; Paseo over Tailscale is the sole mobile agent surface" },
  { name = "pandoc",               note = "Universal markup converter (md ↔ docx ↔ pdf ↔ html ↔ …)" },
]

[[section]]
name = "System CLI"
kind = "formula"
packages = [
  { name = "htop",               note = "System monitoring" },
  { name = "iftop",              note = "Network traffic monitoring", disabled = true, reason = "Disabled 2026-08-26: no tracked use across the private repositories; install temporarily for network diagnosis" },
  { name = "nmap",               note = "Network discovery and port scanning", disabled = true, reason = "Disabled 2026-08-26: no tracked use across the private repositories; install temporarily for network diagnosis" },
  { name = "flux",               note = "InfluxDB Flux query language", disabled = true, reason = "Disabled 2026-08-26: undeclared host residue with no tracked database-query workflow; unrelated to the desired flux-app cask" },
  { name = "dockutil",           note = "Dock management" },
  { name = "terminal-notifier",  note = "Native Claude and Codex notifications replaced the custom hook", disabled = true, reason = "Disabled 2026-07-15: native Claude and Codex notifications replaced the custom hook" },
  { name = "duti",               note = "Set default app for file types (used by file-associations.sh)" },
]

[[section]]
name = "Developer Tools"
kind = "formula"
packages = [
  { name = "just",           note = "Command runner (like make, but simpler)" },
  { name = "lefthook",       note = "Git hooks (language-agnostic, parallel execution)" },
  { name = "shellcheck",     note = "Static analysis for shell scripts" },
  { name = "hyperfine",      note = "Command-line benchmarking tool", disabled = true, reason = "Disabled 2026-08-26: no tracked benchmark workflow across the private repositories; install per investigation" },
  { name = "graphite",       note = "Stacked PRs", disabled = true, reason = "Disabled 2026-08-25 (dated retroactively): not useful enough (requires withgraphite/tap)" },
  { name = "atlas",          note = "Database schema migration tool" },
  { name = "duckdb",         note = "Desired general-purpose analytical SQL database; retain even without a tracked repository reference" },
  { name = "railway",        note = "Railway.app CLI", disabled = true, reason = "Removed 2026-07-15: no active Railway projects; keep the host free of unused deployment clients" },
  { name = "opentofu",       note = "Desired open-source Terraform-compatible infrastructure CLI; retain even without a tracked repository reference" },
  { name = "flyctl",         note = "Desired Fly.io deployment CLI; retain even without a tracked repository reference" },
  { name = "neonctl",        note = "Desired Neon Postgres administration CLI; retain even without a tracked repository reference" },
  { name = "infisical",      note = "Secrets management CLI" },
  { name = "git-filter-repo", note = "Git history rewriting (secrets scrub)", disabled = true, reason = "Disabled 2026-07-15: rarely needed; install temporarily when a repository history rewrite is required" },
  { name = "libpq",          note = "PostgreSQL client library (psql, pg_dump)" },
  { name = "sccache",        note = "Shared compilation cache for Rust and C/C++", disabled = true, reason = "Disabled 2026-08-26: no tracked compiler-cache configuration or use across the private repositories" },
  { name = "temporal",       note = "Temporal workflow CLI", disabled = true, reason = "Disabled 2026-06-01: experiment; reinstall if revisiting durable workflows" },
  { name = "pulumi",         note = "IaC in real languages", disabled = true, reason = "Disabled 2026-06-01: experiment; opentofu is the active IaC tool" },
  { name = "sentry-cli",     note = "Sentry error tracking (releases, source maps, deploys)", disabled = true, reason = "Disabled 2026-07-15: no active personal Sentry usage; originally installed only for agent-driven service administration" },
  { name = "datadog-ci",     note = "Datadog CI test visibility & synthetics", disabled = true, reason = "Disabled 2026-07-15: no active personal Datadog usage; originally installed only for agent-driven service administration" },
]

[[section]]
name = "Security"
kind = "formula"
packages = [
  { name = "gitleaks",     note = "Secret scanner: hardcoded creds in git history/working tree" },
  { name = "osv-scanner",  note = "Dependency vulnerability scanner using the OSV database", disabled = true, reason = "Disabled 2026-08-26: no tracked use across the private repositories; project-native audits cover current dependency checks" },
  { name = "semgrep",      note = "Static analysis / SAST: pattern-based code vulnerability rules" },
  { name = "trivy",        note = "Container, filesystem, dependency, and IaC vulnerability scanner", disabled = true, reason = "Disabled 2026-08-26: no tracked container or IaC scanning workflow across the private repositories" },
]

[[section]]
name = "JavaScript / TypeScript"
kind = "formula"
packages = [
  { name = "bun",  note = "Retired JavaScript runtime and package manager", disabled = true, reason = "Disabled 2026-09-01: active projects migrated to Node and pnpm; credentialed automation uses bounded Deno" },
  { name = "deno", note = "Permission-bounded TypeScript runtime for credentialed automation" },
  { name = "fnm",  note = "Node version manager; installs the current LTS for Astro and other Node projects" },
]

[[section]]
name = "Go"
kind = "formula"
packages = [
  { name = "go",             note = "Go programming language" },
  { name = "golangci-lint",  note = "Go linter aggregator" },
]

[[section]]
name = "Python"
kind = "formula"
packages = [
  { name = "uv",     note = "Python package/installer & the dotfiles CLI runtime. Bootstrap prerequisite (installed before this manifest runs); declared here for documentation + stale-suppression." },
  { name = "py-spy", note = "Sampling profiler for live Python processes", disabled = true, reason = "Disabled 2026-08-26: no tracked profiling workflow across the private repositories; install per investigation" },
]

# =============================================================================
# Applications (casks)
# =============================================================================

[[section]]
name = "Essentials"
kind = "cask"
packages = [
  { name = "google-chrome",   note = "Web browser" },
  { name = "google-drive",    note = "Drive <-> Mac selective sync. Use STREAMING mode (default; nothing bulk-downloaded) + per-folder 'Available offline' for local copies; pick which Mac folders upload under Settings > My MacBook. Never enable 'Mirror files' (would pull all of Drive)" },
  { name = "tailscale-app",   note = "Mesh VPN for secure laptop access" },
  { name = "termius",         note = "Former phone SSH/Mosh client for remote access; retired", disabled = true, reason = "Retired 2026-08-26: phone access is Paseo over Tailscale; no phone SSH client is needed" },
]

[[section]]
name = "IDE"
kind = "cask"
packages = [
  { name = "cursor",              note = "AI-native editor", disabled = true, reason = "Disabled 2026-07-15: extra editor/agent control plane did not earn its overlap with Zed + Claude/Codex" },
  { name = "zed",                 note = "Primary GPU-native editor with ACP agent panel" },
]

[[section]]
name = "Productivity"
kind = "cask"
flag = "productivity"
packages = [
  { name = "rectangle",        note = "Window management" },
  { name = "flycut",           note = "Clipboard manager" },
  { name = "ghostty",          note = "GPU-accelerated terminal" },
  { name = "caffeine",         note = "Intel-only, requires Rosetta" },
  { name = "flux-app",         note = "Screen color temperature" },
  { name = "granola",          note = "Install manually from https://www.granola.ai/download", disabled = true, reason = "Disabled 2026-09-01: the Homebrew cask can lag official releases and overwrite a newer Granola app" },
  { name = "perplexity",       note = "No Homebrew cask; app was installed manually", disabled = true, reason = "Disabled 2026-07-14: desktop app removed; use web only if needed" },
  { name = "wispr-flow",       note = "No Homebrew cask exists; installed via special.typewhisper block", disabled = true, reason = "Disabled 2026-05-29: switched to TypeWhisper (on-device Apple SpeechAnalyzer dictation)" },
  { name = "aqua-voice",       note = "Voice dictation alternative", disabled = true, reason = "Disabled 2026-07-15: local TypeWhisper is private, adequate, and subscription-free" },
  { name = "obsidian",         note = "Former Markdown editor; Notes website is the primary knowledge interface", disabled = true, reason = "Retired 2026-08-26: the Notes website now provides the useful reading, editing, finance, and world-model surfaces without the plugin and sync burden" },
  { name = "qlmarkdown",       note = "Quick Look: rendered .md previews (sbarex)" },
  { name = "syntax-highlight", note = "Quick Look: syntax highlighting for code, yaml, toml, json, cfg, etc. (sbarex)" },
