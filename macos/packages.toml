packages = [
  { name = "orbstack",         note = "Docker Desktop alternative (faster, better macOS integration)" },
  { name = "ngrok",            note = "Secure tunnels to localhost (official Homebrew cask; installs the CLI binary)" },
  { name = "axiom",            note = "Axiom observability CLI (axiomhq/tap cask; narrowly trusted above)" },
  { name = "gcloud-cli",       note = "Google Cloud SDK (cask renamed from google-cloud-sdk). Re-enabled 2026-07-06: hard dependency of `gws auth setup` (OAuth client provisioning)" },
]

[[section]]
