packages = [
  { name = "spotify",             note = "" },
  { name = "slack",               note = "" },
  { name = "slack-cli",           note = "Slack platform dev CLI (app development, not chat)", disabled = true, reason = "Disabled 2026-07-15: Slack is infrequently used and does not need local automation" },
  { name = "zoom",                note = "" },
  { name = "whatsapp",            note = "" },
]

[[section]]
