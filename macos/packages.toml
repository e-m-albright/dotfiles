  { name = "huggingface-cli",      note = "Hugging Face CLI", disabled = true, reason = "Disabled 2026-07-15: no model-development workflow needs it; install per-project if local-model experimentation resumes" },
]

[[section]]
name = "Special Formulae"
kind = "formula"
packages = [
  { name = "docker-compose",  note = "Docker Compose (formula-only, not cask)" },
  { name = "omlx",            flag = "ai", note = "Open-source MLX inference server for Apple Silicon: multi-model serving, prefix caching, OpenAI/Anthropic APIs (jundot/omlx)" },
  { name = "ollama",          note = "~30% slower than llama.cpp; redundant", disabled = true, reason = "Disabled 2026-08-28: oMLX is the active Apple Silicon runner; Ollama adds no needed compatibility advantage and previously trailed native MLX throughput" },
  { name = "llama.cpp",       note = "Useful for raw `llama-bench` / `llama-server`; reinstall when needed", disabled = true, reason = "Disabled 2026-08-28: oMLX is the active runner; reinstall llama.cpp only for a cross-runtime benchmark or a GGUF model with no viable MLX build" },
]

# =============================================================================
# Special installers (not plain brew)
# =============================================================================

[special.omlx]
method = "omlx_setup"
flag = "ai"
note = "Idempotently install xgrammar, repair its macOS loader metadata when needed, download the selected Qwen model, and restart oMLX after changes"

[special.rust]
method = "rustup"
note = "Official installer; preferred over Homebrew for version management"

[special.typewhisper]
method = "github_dmg"
flag = "productivity"
note = "On-device voice-to-text via Apple SpeechAnalyzer. Replaced Wispr Flow 2026-05-29. No Homebrew cask. Keep the live engine set to `speechAnalyzer`; Parakeet was disabled 2026-08-26 because its local model added latency and memory use without enough quality benefit. GPLv3; ships a REST API on 127.0.0.1:8978 (off by default) and a `typewhisper` CLI."

[special.supertonic]
method = "python_package"
flag = "ai"
disabled = true
reason = "Retired 2026-08-26: local neural speech did not provide enough value to justify its model, dependency, and cross-repository integration surface; revisit only when a concrete recurring workflow makes speech materially useful"
note = "Tombstone for the retired Supertonic local neural text-to-speech experiment."

[special.claude_code]
method = "curl_install"
flag = "ai"
note = "Tracks `latest`, not the lagging `stable` cask. Migrated off npm global 2026-05-28."

