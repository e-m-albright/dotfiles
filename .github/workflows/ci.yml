name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4

      # Keep file validation owned by the same recipe as local `just verify`.
      - name: Validate tracked shell and JSON files
        run: just validate-files

      - name: Privacy sweep (no absolute home paths in tracked files)
        run: just privacy-sweep

      - name: ShellCheck
        uses: ludeeus/action-shellcheck@00cae500b08a931fb5698e11e79bfbd38e612a38 # 2.0.0
        with:
          severity: warning
          ignore_paths: ".git"

  # Together with lint above, this is the same gate set as local `just verify`.
  cli:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
      - uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4
      - name: Quality gate (fmt, lint, types, deadcode, complexity, tests)
        run: just check
      - name: Dependency vulnerability audit (pip-audit)
        run: just audit

  # Clean-machine rehearsal for the portable install plan and read-only doctor command.
  # Non-zero doctor exits are expected (a clean box has gaps to report); a traceback is not.
  # The mutating install path remains macOS-specific and is never run here.
  clean-machine:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
      - name: Validate the read-only macOS install plan
        run: ./install.sh --plan
      - name: Install the dotfiles CLI
        working-directory: cli
        run: uv sync --frozen
      - name: Rehearse doctor against a clean HOME
        working-directory: cli
        run: |
          set -u
          home="$(mktemp -d)"
          bin=".venv/bin/dotfiles"
          fail=0
          check() {  # <label> <args...> — fails the job only on a Python traceback
            local label="$1"; shift
            echo "::group::dotfiles $label (clean HOME)"
            HOME="$home" timeout 150 "$bin" "$@" >out.txt 2>&1 || echo "(exit $? — tolerated unless traceback)"
            cat out.txt
            if grep -q 'Traceback (most recent call last)' out.txt; then
              echo "::error::dotfiles $label crashed with a traceback on a clean machine"
              fail=1
            fi
            echo "::endgroup::"
          }
          check "doctor" doctor
          check "remote status" remote status
          check "brew stale" brew stale
          exit "$fail"
