<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" role="img" aria-labelledby="title description">
  <title id="title">Dotfiles fingerprint mark</title>
  <desc id="description">A block-printed red-granite fingerprint in feldspar, iron, quartz, mica, and mineral gray on a dark stone field.</desc>
  <defs>
    <linearGradient id="site-accent" x1="80" y1="80" x2="944" y2="944" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#e4d2bd"/>
      <stop offset="0.2" stop-color="#c29a82"/>
      <stop offset="0.4" stop-color="#a66757"/>
      <stop offset="0.6" stop-color="#7b5049"/>
      <stop offset="0.8" stop-color="#514b49"/>
      <stop offset="1" stop-color="#30383a"/>
    </linearGradient>
    <radialGradient id="stone-field" cx="0" cy="0" r="1" gradientTransform="translate(512 460) rotate(90) scale(760)" gradientUnits="userSpaceOnUse">
      <stop stop-color="#292524"/>
      <stop offset="1" stop-color="#1c1917"/>
    </radialGradient>
    <filter id="block-print" x="-4%" y="-4%" width="108%" height="108%" color-interpolation-filters="sRGB">
      <feTurbulence type="fractalNoise" baseFrequency="0.012 0.07" numOctaves="3" seed="79" result="grain"/>
      <feDisplacementMap in="SourceGraphic" in2="grain" scale="6" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
  </defs>
  <rect width="1024" height="1024" fill="url(#stone-field)"/>
